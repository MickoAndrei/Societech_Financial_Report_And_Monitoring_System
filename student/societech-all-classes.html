<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Classes</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="student.css" />
  <link rel="stylesheet" href="../assets/css/responsive-breakpoints.css" />
</head>
<body class="student-layout" data-page="societech-all-classes">
  <div class="page-background" aria-hidden="true"></div>
  <div class="student-shell">
    <aside id="sidebar-container" class="sidebar"></aside>
    <div class="student-content">
      <header class="student-topbar">
        <div class="header-title">
          <h1>All Classes</h1>
          <div class="header-breadcrumb">View all BSIT sections and class treasurers</div>
        </div>
        <div class="header-actions">
          <div class="profile-wrapper">
            <div class="profile" onclick="toggleProfileMenu()">
              <div class="profile-img">MS</div>
              <div class="profile-info">
                <div class="profile-name">Mark Santos</div>
                <div class="profile-role">Societech Treasurer</div>
              </div>
            </div>
            <div class="profile-menu" id="profileMenu">
              <button type="button" onclick="window.location.href='settings.html'">Settings</button>
              <button type="button" onclick="logout()">Logout</button>
            </div>
          </div>

        </div>
      </header>
      <main class="student-main">
        <div class="student-content-overlay">
          <div class="st-search-filter-bar">
            <div class="student-search">
              <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
              <input type="search" id="classSearch" placeholder="Search classes..." autocomplete="off" />
            </div>
            <select id="yearFilter" class="st-filter-select">
              <option value="all">All Years</option>
              <option value="BSIT 1">BSIT 1</option>
              <option value="BSIT 2">BSIT 2</option>
              <option value="BSIT 3">BSIT 3</option>
            </select>
            <select id="sectionFilter" class="st-filter-select">
              <option value="all">All Sections</option>
              <option value="A">A</option>
              <option value="B">B</option>
            </select>
          </div>
          <div class="st-classes-grid" id="classesGrid"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/class-rosters.js"></script>
  <script src="../assets/js/societech-payments.js"></script>
  <script src="student-session.js"></script>
  <script src="student.js"></script>
  <script src="student-bar.js"></script>
  <script src="societech-all-classes.js"></script>
</body>
</html>
