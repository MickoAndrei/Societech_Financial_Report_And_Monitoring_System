<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Payments</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="student.css" />
</head>
<body class="student-layout" data-page="societech-payments">
  <div class="page-background" aria-hidden="true"></div>
  <div class="student-shell">
    <aside id="sidebar-container" class="sidebar"></aside>
    <div class="student-content">
      <header class="student-topbar">
        <div class="header-title">
          <h1>Manage Payments</h1>
          <div class="header-breadcrumb">Add and edit Societech assessments (e.g. IT Panagmaya)</div>
        </div>
        <div class="header-actions">
          <div class="profile-wrapper">
            <div class="profile" onclick="toggleProfileMenu()">
              <div class="profile-img">MS</div>
              <div class="profile-info">
                <div class="profile-name">Mark Santos</div>
                <div class="profile-role">Societech Treasurer</div>
              </div>
            </div>
            <div class="profile-menu" id="profileMenu">
              <button type="button" onclick="window.location.href='settings.html'">Settings</button>
              <button type="button" onclick="logout()">Logout</button>
            </div>
          </div>

        </div>
      </header>
      <main class="student-main">
        <div class="student-content-overlay">
          <div class="st-page-toolbar">
            <p class="section-subtitle">Create society-wide fees with amount and deadline.</p>
            <button type="button" class="btn btn-primary" id="addPaymentBtn">Add Payment</button>
          </div>
          <table class="student-table" id="paymentsTable">
            <thead>
              <tr>
                <th>Payment name</th>
                <th>Amount</th>
                <th>Deadline</th>
                <th>Description</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/class-rosters.js"></script>
  <script src="../assets/js/societech-payments.js"></script>
  <script src="student-session.js"></script>
  <script src="student.js"></script>
  <script src="student-bar.js"></script>

  <div class="student-modal-overlay st-form-modal" id="paymentFormModal">
    <div class="student-modal">
      <div class="student-modal-header">
        <h2 id="paymentModalTitle">Add Payment</h2>
      </div>
      <form id="paymentForm">
        <div class="card-content">
          <div class="form-group">
            <label for="paymentName">Payment name</label>
            <input class="form-input" id="paymentName" required placeholder="e.g. IT Days / Panagmaya" />
          </div>
          <div class="form-group">
            <label for="paymentAmount">Amount (PHP)</label>
            <input class="form-input" id="paymentAmount" type="number" min="0" step="0.01" required />
          </div>
          <div class="form-group">
            <label for="paymentDeadline">Deadline</label>
            <input class="form-input" id="paymentDeadline" type="date" required />
          </div>
          <div class="form-group">
            <label for="paymentDescription">Description</label>
            <textarea class="form-input" id="paymentDescription" rows="3" placeholder="Optional notes"></textarea>
          </div>
        </div>
        <div class="student-modal-footer">
          <button type="button" class="btn btn-secondary" data-close-payment-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
  <script src="societech-payments-page.js"></script>
</body>
</html>
