<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Societech Financial System</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }
        
        .login-background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('../assets/images/d6d628d6-1548-4d35-8176-5656c91409f5.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(8px);
            z-index: 0;
        }
        
        .login-container::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.8) 0%, rgba(118, 75, 162, 0.8) 100%);
            z-index: 1;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-xl);
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-xl);
            position: relative;
            z-index: 2;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-header img {
            height: 60px;
            margin-bottom: 1rem;
        }
        
        .login-header h1 {
            font-size: 1.75rem;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }
        
        .login-header p {
            color: var(--gray-600);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: var(--font-size-sm);
        }
        
        .form-options label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }
        
        .form-options a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        .form-options a:hover {
            text-decoration: underline;
        }
        
        .admin-link,
        .back-home-link {
            display: block;
            text-align: center;
            font-size: var(--font-size-sm);
        }

        .admin-link {
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .admin-link:hover {
            text-decoration: underline;
        }

        .back-home-link {
            color: var(--gray-500);
            text-decoration: none;
        }

        .back-home-link:hover {
            text-decoration: underline;
            color: var(--gray-600);
        }
        
        .btn-login {
            width: 100%;
            padding: 0.75rem;
            font-size: var(--font-size-base);
            margin-bottom: 1rem;
        }
        
        .divider {
            text-align: center;
            margin: 1.5rem 0;
            position: relative;
            color: var(--gray-500);
        }
        
        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: var(--gray-200);
        }
        
        .divider span {
            background: white;
            padding: 0 1rem;
            position: relative;
        }
        
        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--gray-600);
        }
        
        .register-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
  <link rel="stylesheet" href="../assets/css/responsive-breakpoints.css" />
</head>
<body>
    <div class="login-background"></div>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="../assets/images/societech_logo.png" alt="Societech Logo">
                <h1>Welcome</h1>
                <p>Sign in to your account</p>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="Enter your email"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Enter your password"
                        required
                    >
                </div>
                
                <div class="form-options">
                    <label>
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>
                    <a href="forgot-password.html">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-login">Sign In</button>
                <a href="admin-login.html" class="admin-link">Admin Here</a>
                <a href="../public/index.html" class="back-home-link">Back to Homepage</a>
            </form>
            
        </div>
    </div>
    
    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            const emailLower = email.trim().toLowerCase();
            const demoClassTreasurer = ['alyssa.cruz.bsit1a@societech.demo'];
            const demoSocTreasurer = ['societech.treasurer@societech.demo'];

            let role = 'student';
            let classKey = 'BSIT1A';
            let fullName = 'Student';
            let program = 'BSIT 1A — Societech member';

            if (demoSocTreasurer.includes(emailLower)) {
              role = 'societech_treasurer';
              classKey = 'BSIT2A';
              fullName = 'Mark Santos';
              program = 'BSIT 2A — Societech officer';
            } else if (demoClassTreasurer.includes(emailLower)) {
              role = 'class_treasurer';
              classKey = 'BSIT1A';
              fullName = 'Alyssa Cruz';
              program = 'BSIT 1A — Societech member';
            }

            const session = { role, classKey, fullName, email: emailLower };

            localStorage.setItem('studentSession', JSON.stringify(session));
            localStorage.setItem('studentPersonalInfo', JSON.stringify({
              fullName,
              email: emailLower,
              phone: '+63 917 555 0142',
              program,
            }));

            console.log('Login attempt:', { email, remember, session });

            if (role === 'societech_treasurer') {
              window.location.href = '../student/societech-dashboard.html';
            } else {
              window.location.href = '../student/index.html';
            }
        }
    </script>
</body>
</html>
