<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Announcements • Societech Admin</title>
  <link rel="stylesheet" type="text/css" href="admin-shared-styles.css" />
  <link rel="stylesheet" type="text/css" href="../assets/css/background.css" />
  <link rel="stylesheet" href="../assets/css/responsive-breakpoints.css" />
</head>
<body>
  <div class="page-background"></div>
  <div class="page-content">
    <div class="dashboard-container">
      <aside id="sidebar-container" class="sidebar"></aside>

      <main class="main-content">
        <header class="header">
          <div class="header-title">
            <h1>Announcements</h1>
            <div class="header-breadcrumb">Post society-wide updates — shown on all notification bells</div>
          </div>

          <div class="header-actions">
            <button class="notification-btn" type="button" aria-label="View announcements">
              <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
              </svg>
              <span class="notification-badge" hidden>0</span>
            </button>

            <div class="profile-wrapper">
              <div class="profile" onclick="toggleProfileMenu()">
                <div class="profile-img">MA</div>
                <div class="profile-info">
                  <div class="profile-name">Moderator Admin</div>
                  <div class="profile-role">Administrator</div>
                </div>
              </div>
              <div class="profile-menu" id="profileMenu">
                <button type="button" onclick="window.location.href='settings.html'">Settings</button>
                <button type="button" onclick="logout()">Logout</button>
              </div>
            </div>
          </div>
        </header>

        <div id="announcements" class="content-section active">
          <div style="margin-bottom: 24px;">
            <button type="button" class="btn btn-primary" id="showComposeBtn">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
              </svg>
              Post New Announcement
            </button>
          </div>

          <div class="card announcement-compose-card" id="announcementComposeCard" hidden>
            <div class="card-header">
              <div class="card-title" id="announcementFormTitle">New announcement</div>
            </div>
            <form id="announcementForm" class="card-content">
              <div class="form-group">
                <label class="form-label" for="announcementTitle">Title</label>
                <input class="form-input" id="announcementTitle" required placeholder="e.g. Fee payment deadline extension" />
              </div>
              <div class="form-group">
                <label class="form-label" for="announcementBody">Message</label>
                <textarea class="form-input" id="announcementBody" rows="4" required placeholder="Write the full announcement for students and treasurers…"></textarea>
              </div>
              <div class="grid-2">
                <div class="form-group">
                  <label class="form-label" for="announcementAuthor">Posted by</label>
                  <input class="form-input" id="announcementAuthor" value="Moderator Admin" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="announcementPosted">Posted date</label>
                  <input class="form-input" id="announcementPosted" type="date" required />
                </div>
              </div>
              <div class="grid-2">
                <div class="form-group">
                  <label class="form-label" for="announcementEnds">End date (optional)</label>
                  <input class="form-input" id="announcementEnds" type="date" />
                  <small style="color:#6b7280;">Leave blank to keep visible until you deactivate it.</small>
                </div>
                <div class="form-group" style="display:flex;align-items:flex-end;">
                  <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                    <input type="checkbox" id="announcementActive" checked />
                    Active (show on notification bells)
                  </label>
                </div>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;">
                <button type="submit" class="btn btn-primary">Save announcement</button>
                <button type="button" class="btn btn-secondary" id="cancelComposeBtn" hidden>Cancel</button>
              </div>
            </form>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-title">All announcements</div>
            </div>
            <div id="announcementList"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="sidebar.js"></script>
  <script src="../assets/js/announcements-loader.js"></script>
  <script src="shared.js"></script>
  <script src="../assets/js/societech-announcements.js"></script>
  <script src="announcements-page.js"></script>
  </div>
</body>
</html>
