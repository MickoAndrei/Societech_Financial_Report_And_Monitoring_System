<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fee Configuration • Societech Admin</title>
  <link rel="stylesheet" type="text/css" href="admin-shared-styles.css" />
  <link rel="stylesheet" type="text/css" href="../assets/css/background.css" />
</head>
<body>
  <div class="page-background"></div>
  <div class="page-content">
  <div class="dashboard-container">
    <aside id="sidebar-container" class="sidebar"></aside>
    <main class="main-content">
      <header class="header">
        <div class="header-title">
          <h1>Fee Configuration</h1>
          <div class="header-breadcrumb">Configure membership and event fees</div>
        </div>
        <div class="header-actions">
          <button class="notification-btn" type="button" onclick="alert('5 new notifications')">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
            </svg>
            <span class="notification-badge">5</span>
          </button>
          <div class="profile-wrapper">
  <div class="profile" onclick="toggleProfileMenu()">
    <div class="profile-img">MA</div>
    <div class="profile-info">
      <div class="profile-name">Moderator Admin</div>
      <div class="profile-role">Administrator</div>
    </div>
  </div>
  <div class="profile-menu" id="profileMenu">
    <button type="button" onclick="window.location.href='settings.html'">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
      </svg>
      Settings
    </button>
    <button type="button" onclick="logout()">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
      </svg>
      Logout
    </button>
  </div>
</div>
        </div>
      </header>
<div id="fee-config" class="content-section active">
                <div class="grid-2">
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Organization Fees</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Organizational Fee (Per Student)</label>
                            <input type="number" class="form-input" value="50" placeholder="Enter amount">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Event Fee</label>
                            <input type="number" class="form-input" value="280" placeholder="Enter amount">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Membership Fee</label>
                            <input type="number" class="form-input" value="80" placeholder="Enter amount">
                        </div>
                        <button class="btn btn-primary">Update Organization Fees</button>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Class Fee Template</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Default Class Fee</label>
                            <input type="number" class="form-input" value="80" placeholder="Enter amount">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Project Fund</label>
                            <input type="number" class="form-input" value="150" placeholder="Enter amount">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Activity Fund</label>
                            <input type="number" class="form-input" value="100" placeholder="Enter amount">
                        </div>
                        <button class="btn btn-primary">Update Class Fee Template</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Class-Specific Fees</div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Class</th>
                                    <th>Class Fee</th>
                                    <th>Additional Fees</th>
                                    <th>Total</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Societech 1A</td>
                                    <td>₱80</td>
                                    <td>₱280</td>
                                    <td style="font-weight: 600;">₱360</td>
                                    <td><button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;">Edit</button></td>
                                </tr>
                                <tr>
                                    <td>Societech 1B</td>
                                    <td>₱80</td>
                                    <td>₱250</td>
                                    <td style="font-weight: 600;">₱330</td>
                                    <td><button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;">Edit</button></td>
                                </tr>
                                <tr>
                                    <td>Societech 2A</td>
                                    <td>₱90</td>
                                    <td>₱280</td>
                                    <td style="font-weight: 600;">₱370</td>
                                    <td><button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;">Edit</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
    </main>
  </div>
  <script src="sidebar.js"></script>
  <script src="shared.js"></script>
  </div>
</body>
</html>
