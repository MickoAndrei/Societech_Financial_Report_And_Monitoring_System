<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fee Configuration • Societech Admin</title>
  <link rel="stylesheet" type="text/css" href="admin-shared-styles.css" />
</head>
<body>
  <div class="dashboard-container">
    <aside id="sidebar-container" class="sidebar"></aside>
    <main class="main-content">
      <header class="header">
        <div class="header-title">
          <h1>Fee Configuration</h1>
          <div class="header-breadcrumb">Home / Fee Configuration</div>
        </div>
        <div class="header-actions">
          <button class="notification-btn" type="button" onclick="alert('5 new notifications')">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
            </svg>
            <span class="notification-badge">5</span>
          </button>
          <div class="profile" onclick="alert('Profile settings')">
            <div class="profile-img">MA</div>
            <div class="profile-info">
              <div class="profile-name">Moderator Admin</div>
              <div class="profile-role">Administrator</div>
            </div>
          </div>
        </div>
      </header>
<div id="fee-config" class="content-section active">
                <div class="grid-2">
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Organization Fees</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Organizational Fee (Per Student)</label>
                            <input type="number" class="form-input" value="100" placeholder="Enter amount">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Event Fee</label>
                            <input type="number" class="form-input" value="50" placeholder="Enter amount">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Membership Fee</label>
                            <input type="number" class="form-input" value="150" placeholder="Enter amount">
                        </div>
                        <button class="btn btn-primary">Update Organization Fees</button>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Class Fee Template</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Default Class Fee</label>
                            <input type="number" class="form-input" value="500" placeholder="Enter amount">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Project Fund</label>
                            <input type="number" class="form-input" value="200" placeholder="Enter amount">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Activity Fund</label>
                            <input type="number" class="form-input" value="150" placeholder="Enter amount">
                        </div>
                        <button class="btn btn-primary">Update Class Fee Template</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Class-Specific Fees</div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Class</th>
                                    <th>Class Fee</th>
                                    <th>Additional Fees</th>
                                    <th>Total</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Grade 11 - STEM A</td>
                                    <td>₱500</td>
                                    <td>₱350</td>
                                    <td style="font-weight: 600;">₱850</td>
                                    <td><button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;">Edit</button></td>
                                </tr>
                                <tr>
                                    <td>Grade 11 - ABM A</td>
                                    <td>₱500</td>
                                    <td>₱300</td>
                                    <td style="font-weight: 600;">₱800</td>
                                    <td><button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;">Edit</button></td>
                                </tr>
                                <tr>
                                    <td>Grade 12 - STEM B</td>
                                    <td>₱600</td>
                                    <td>₱450</td>
                                    <td style="font-weight: 600;">₱1,050</td>
                                    <td><button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;">Edit</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
    </main>
  </div>
  <script src="sidebar.js"></script>
</body>
</html>
